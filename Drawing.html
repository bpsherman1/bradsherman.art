            opacity: 0.7;
            transition: opacity 0.3s;

        .nav-btn::before {
            content: '';

            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            border: 3px solid #000000;
            border-width: 3px 3px 0 0;
            transform: translate(-50%, -50%) rotate(45deg);
        }

        .prev-btn {
            left: 30px;
        }

        .prev-btn::before {
            transform: translate(-50%, -50%) rotate(-135deg);
        }

        .next-btn {
            right: 30px;

// Full Screen Image Viewer
const modal = document.getElementById('imageModal');
const modalImage = document.querySelector('.modal-image');
const closeModal = document.querySelector('.close-modal');
const prevBtn = document.querySelector('.prev-btn');
const nextBtn = document.querySelector('.next-btn');

// Get all images on the page (all image classes)
const workImages = document.querySelectorAll('.work-image');
const worksImages = document.querySelectorAll('.works-image');
const workssImages = document.querySelectorAll('.workss-image');
const worksssImages = document.querySelectorAll('.worksss-image');

// Combine all arrays
const allImages = [...workImages, ...worksImages, ...workssImages, ...worksssImages];
let currentImageIndex = 0;
let images = [];

// Extract image URLs from background images
allImages.forEach((img, index) => {
    const bgImage = img.style.backgroundImage;
    console.log(`Image ${index}:`, bgImage); // Debug log
    
    // Extract URL from background-image: url('...')
    if (bgImage && bgImage !== 'none') {
        const imageUrl = bgImage.replace(/url\(['"]?(.*?)['"]?\)/i, '$1');
        images.push(imageUrl);
        
        // Make image clickable
        img.addEventListener('click', () => {
            currentImageIndex = index;
            openModal();
        });
        
        console.log(`Added image ${index}:`, imageUrl); // Debug log
    }
});

console.log('Total images found:', images.length); // Debug log

function openModal() {
    if (images.length === 0) {
        console.log('No images found'); // Debug log
        return;
    }
    modal.style.display = 'flex';
    modalImage.src = images[currentImageIndex];
    document.body.style.overflow = 'hidden'; // Prevent scrolling
}

function closeModalFunc() {
    modal.style.display = 'none';
    document.body.style.overflow = 'auto'; // Re-enable scrolling
}

function showNextImage() {
    currentImageIndex = (currentImageIndex + 1) % images.length;
    modalImage.src = images[currentImageIndex];
}

function showPrevImage() {
    currentImageIndex = (currentImageIndex - 1 + images.length) % images.length;
    modalImage.src = images[currentImageIndex];
}

// Event listeners
closeModal.addEventListener('click', closeModalFunc);
nextBtn.addEventListener('click', showNextImage);
prevBtn.addEventListener('click', showPrevImage);

// Close modal when clicking outside image
modal.addEventListener('click', (e) => {
    if (e.target === modal) {
        closeModalFunc();
    }
});

// Keyboard navigation
document.addEventListener('keydown', (e) => {
    if (modal.style.display === 'flex') {
        if (e.key === 'Escape') closeModalFunc();
        if (e.key === 'ArrowRight') showNextImage();
        if (e.key === 'ArrowLeft') showPrevImage();
    }
});
        // Horizontal Slideshow Scroll Control
        const slideshow = document.querySelector('.horizontal-slideshow');

        // Scroll-based movement ONLY for desktop
        window.addEventListener('scroll', () => {
            const scrollY = window.scrollY;
            const maxScroll = window.innerHeight * 1.5;
            const scrollPercent = Math.min(scrollY / maxScroll, 1);
            const slideshowPosition = -(scrollPercent * 115);
            
            if (window.innerWidth > 768) {
                slideshow.style.transform = `translateX(${slideshowPosition}%)`;
            }
        });

        // Reset on scroll to top
        window.addEventListener('scroll', () => {
            if (window.scrollY === 0) {
                slideshow.style.transform = 'translateX(0%)';
            }
        });

        // Navigation hover effects
        document.querySelectorAll('nav a').forEach(link => {
            link.addEventListener('mouseenter', () => {
                if (link.querySelector('span')) {
                    link.querySelector('span').style.width = '100%';
                }
            });
            link.addEventListener('mouseleave', () => {
                if (link.querySelector('span')) {
                    link.querySelector('span').style.width = '0';
                }
            });
        });

        function updateMobileTitle() {
    if (window.innerWidth <= 768) {
        const pageTitle = document.querySelector('.page-title');
        if (pageTitle && pageTitle.textContent === 'DRAWINGS') {
            pageTitle.textContent = 'GRAPHITE DRAWINGS';
        }
    }
}

// Run on load and resize
window.addEventListener('load', updateMobileTitle);
window.addEventListener('resize', updateMobileTitle);
        
    </script>
