<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="images_2/favicon.png">
    <link rel="apple-touch-icon" href="images_2/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drawing - Brad Sherman</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #ffffff;
            color: #000000;
            overflow-x: hidden;
        }

        /* ── MODAL ────────────────────────────────────────── */
        .image-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(255,255,255,0.97);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            max-width: 90%;
            max-height: 90%;
            position: relative;
        }
        .modal-image {
            max-width: 100%;
            max-height: 90vh;
            object-fit: contain;
        }
        .close-modal {
            position: fixed;
            top: 20px; right: 30px;
            color: #000000;
            font-size: 36px;
            font-weight: 300;
            cursor: pointer;
            z-index: 1001;
            background: none;
            border: none;
            line-height: 1;
        }
        .nav-btn {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            width: 60px; height: 60px;
            cursor: pointer;
            opacity: 0.4;
            transition: opacity 0.3s;
        }
        .nav-btn:hover { opacity: 1; }
        .nav-btn::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 16px; height: 16px;
            border: 2px solid #000000;
            border-width: 2px 2px 0 0;
            transform: translate(-50%, -50%) rotate(45deg);
        }
        .prev-btn { left: 20px; }
        .prev-btn::before { transform: translate(-50%, -50%) rotate(-135deg); }
        .next-btn { right: 20px; }

        /* ── NAV ──────────────────────────────────────────── */
        nav {
            position: fixed;
            top: 0; width: 100%;
            padding: 2rem;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            mix-blend-mode: difference;
            transition: background 0.4s ease, border-bottom 0.4s ease;
        }

        .nav-name {
            font-family: 'Futura', 'Futura PT', 'Century Gothic', 'Trebuchet MS', sans-serif;
            font-weight: 900;
            font-size: 0.9rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            /* slide in from left on load */
            opacity: 0;
            transform: translateX(-28px);
            animation: slideInLeft 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.5s forwards;
            /* smooth transition for scroll fade */
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
            opacity: 0;
            animation: fadeUp 0.9s ease 0.65s forwards;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        nav a { color: white; text-decoration: none; font-weight: 600; }

        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-28px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .dropdown { position: relative; display: inline-block; }
        .dropdown-content {
            position: absolute;
            top: 35px; left: 0;
            background: #ffffff;
            border: 1px solid #e8e8e8;
            border-radius: 8px;
            padding: 1rem 0;
            min-width: 200px;
            opacity: 0; visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            mix-blend-mode: normal;
            box-shadow: 0 8px 32px rgba(0,0,0,0.08);
        }
        .dropdown:hover .dropdown-content { opacity: 1; visibility: visible; transform: translateY(0); }
        .dropdown-content a {
            display: block;
            padding: 0.5rem 1.5rem;
            color: #000000 !important;
            text-decoration: none;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
            font-weight: 700;
            font-size: 0.9rem;
        }
        .dropdown-content a:hover {
            background: rgba(0,0,0,0.05);
            border-left: 3px solid #ff0055;
            padding-left: 2rem;
        }

        /* ── HERO ─────────────────────────────────────────── */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: #ffffff;
        }

        .hero-title {
            font-family: 'Futura', 'Futura PT', 'Century Gothic', 'Trebuchet MS', sans-serif;
            font-weight: 900;
            font-size: clamp(3.5rem, 9vw, 8rem);
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #000000;
            text-align: center;
            line-height: 1;
            /* fade in on load */
            opacity: 0;
            animation: fadeTitle 1.2s ease 0.15s forwards;
            /* smooth scroll fade handled via JS inline styles */
            will-change: opacity, transform;
        }

        @keyframes fadeTitle {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        /* ── WORK GRID ────────────────────────────────────── */
        .work-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 6rem 5% 12rem 5%;
        }

        .work-section {
            margin-bottom: 18rem;
            opacity: 0;
            transform: translateY(32px);
            transition: opacity 1.4s ease, transform 1.4s ease;
        }
        .work-section.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .single-image { width: 100%; }

        .work-img {
            width: 100%;
            display: block;
            height: auto;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }
        .work-img:hover { opacity: 0.9; }

        .work-info {
            margin-top: 1.8rem;
            padding-top: 1.4rem;
            border-top: 1px solid #ebebeb;
        }

        .work-item-title {
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #000000;
            letter-spacing: 0.02em;
        }

        .project-year {
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            color: #939598;
            font-weight: 400;
            margin-bottom: 0.2rem;
        }

        .project-institution {
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            color: #939598;
            font-style: italic;
            font-weight: 400;
        }

        /* ── MOBILE ───────────────────────────────────────── */
        @media (max-width: 768px) {
            nav { padding: 1rem; }
            .nav-links { gap: 1rem; }
            .hero-title { font-size: clamp(2.5rem, 12vw, 4.5rem); }
            .work-container { padding: 4rem 5% 8rem 5%; }
            .work-section { margin-bottom: 5rem; }

            .dropdown-content {
                position: fixed !important;
                top: 80px !important;
                right: 1rem !important;
                left: auto !important;
                width: 50% !important;
                min-width: unset !important;
                background: #000000 !important;
                border: none !important;
                mix-blend-mode: normal !important;
                backdrop-filter: none !important;
            }
            .dropdown-content a {
                color: #ffffff !important;
                text-align: right !important;
                border-left: none !important;
                mix-blend-mode: normal !important;
            }
        }
    </style>
</head>
<body>

    <!-- Modal -->
    <div id="imageModal" class="image-modal">
        <button class="close-modal">&times;</button>
        <button class="nav-btn prev-btn"></button>
        <button class="nav-btn next-btn"></button>
        <div class="modal-content">
            <img class="modal-image" src="" alt="">
        </div>
    </div>

    <!-- Nav -->
    <nav id="mainNav">
        <div class="nav-name" id="navName">
            <a href="index.html" style="color:white;text-decoration:none;">Brad Sherman</a>
        </div>
        <div class="nav-links" id="navLinks">
            <div class="dropdown">
                <a href="#" style="color:white;text-decoration:none;font-weight:600;cursor:pointer;">Work</a>
                <div class="dropdown-content">
                    <a href="index.html">Home</a>
                    <a href="painting.html">Painting</a>
                    <a href="drawing.html">Drawing</a>
                    <a href="woodworking.html">Woodworking</a>
                    <a href="websites.html">Websites</a>
                    <a href="photography.html">Photography</a>
                </div>
            </div>
            <a href="Contacts.html" style="color:white;text-decoration:none;font-weight:600;">Contact</a>
        </div>
    </nav>

    <!-- Hero -->
    <section class="hero">
        <h1 class="hero-title" id="heroTitle">Drawings</h1>
    </section>

    <!-- Work -->
    <section class="work-container">

        <div class="work-section">
            <div class="single-image">
                <picture>
                    <source media="(max-width: 768px)" srcset="images_2/1-mobile.jpg">
                    <source media="(min-width: 769px)" srcset="images_2/1-desktop.jpg">
                    <img class="work-img" src="images_2/1-desktop.jpg" alt="Still Life" loading="eager" decoding="async"/>
                </picture>
            </div>
            <div class="work-info">
                <h3 class="work-item-title">Still Life</h3>
                <p class="project-year">2022</p>
            </div>
        </div>

        <div class="work-section">
            <div class="single-image">
                <picture>
                    <source media="(max-width: 768px)" srcset="images_2/2-mobile.jpg">
                    <source media="(min-width: 769px)" srcset="images_2/2-desktop.jpg">
                    <img class="work-img" src="images_2/2-desktop.jpg" alt="Martha's Vineyard" loading="lazy" decoding="async"/>
                </picture>
            </div>
            <div class="work-info">
                <h3 class="work-item-title">Martha's Vineyard</h3>
                <p class="project-year">2023</p>
                <p class="project-institution">UW-Madison</p>
            </div>
        </div>

        <div class="work-section">
            <div class="single-image">
                <picture>
                    <source media="(max-width: 768px)" srcset="images_2/3-mobile.jpg">
                    <source media="(min-width: 769px)" srcset="images_2/3-desktop.jpg">
                    <img class="work-img" src="images_2/3-desktop.jpg" alt="Still Life — Rope" loading="lazy" decoding="async"/>
                </picture>
            </div>
            <div class="work-info">
                <h3 class="work-item-title">Still Life</h3>
                <p class="project-year">2023</p>
                <p class="project-institution">UW-Madison</p>
            </div>
        </div>

        <div class="work-section">
            <div class="single-image">
                <picture>
                    <source media="(max-width: 768px)" srcset="images_2/4-mobile.jpg">
                    <source media="(min-width: 769px)" srcset="images_2/4-desktop.jpg">
                    <img class="work-img" src="images_2/4-desktop.jpg" alt="Grandad Portrait" loading="lazy" decoding="async"/>
                </picture>
            </div>
            <div class="work-info">
                <h3 class="work-item-title">Grandad Portrait</h3>
                <p class="project-year">2022</p>
            </div>
        </div>

        <div class="work-section">
            <div class="single-image">
                <picture>
                    <source media="(max-width: 768px)" srcset="images_2/5-mobile.jpg">
                    <source media="(min-width: 769px)" srcset="images_2/5-desktop.jpg">
                    <img class="work-img" src="images_2/5-desktop.jpg" alt="Mountains" loading="lazy" decoding="async"/>
                </picture>
            </div>
            <div class="work-info">
                <h3 class="work-item-title">Mountains</h3>
                <p class="project-year">2023</p>
                <p class="project-institution">UW-Madison</p>
            </div>
        </div>

        <div class="work-section">
            <div class="single-image">
                <picture>
                    <source media="(max-width: 768px)" srcset="images_2/6-mobile.jpg">
                    <source media="(min-width: 769px)" srcset="images_2/6-desktop.jpg">
                    <img class="work-img" src="images_2/6-desktop.jpg" alt="Still Life — Egg" loading="lazy" decoding="async"/>
                </picture>
            </div>
            <div class="work-info">
                <h3 class="work-item-title">Still Life</h3>
                <p class="project-year">2022</p>
            </div>
        </div>

    </section>

    <script>
        // ── Modal ──────────────────────────────────────────
        const modal      = document.getElementById('imageModal');
        const modalImage = document.querySelector('.modal-image');
        const closeBtn   = document.querySelector('.close-modal');
        const prevBtn    = document.querySelector('.prev-btn');
        const nextBtn    = document.querySelector('.next-btn');
        const allImgs    = [...document.querySelectorAll('.work-img')];
        let currentIdx   = 0;

        function openModal(idx) {
            currentIdx = idx;
            modalImage.src = allImgs[idx].src;
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }
        function closeModal() {
            modal.style.display = 'none';
            document.body.style.overflow = '';
        }
        function showNext() {
            currentIdx = (currentIdx + 1) % allImgs.length;
            modalImage.src = allImgs[currentIdx].src;
        }
        function showPrev() {
            currentIdx = (currentIdx - 1 + allImgs.length) % allImgs.length;
            modalImage.src = allImgs[currentIdx].src;
        }

        allImgs.forEach((img, i) => img.addEventListener('click', () => openModal(i)));
        closeBtn.addEventListener('click', closeModal);
        nextBtn.addEventListener('click', showNext);
        prevBtn.addEventListener('click', showPrev);
        modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
        document.addEventListener('keydown', e => {
            if (modal.style.display !== 'flex') return;
            if (e.key === 'Escape')      closeModal();
            if (e.key === 'ArrowRight')  showNext();
            if (e.key === 'ArrowLeft')   showPrev();
        });

        // ── Scroll: fade hero title + nav text, solidify nav ──
        const nav       = document.getElementById('mainNav');
        const heroTitle = document.getElementById('heroTitle');
        const navName   = document.getElementById('navName');
        const navLinks  = document.getElementById('navLinks');

        const vh         = window.innerHeight;
        const FADE_START = 0;           // start fading immediately
        const FADE_END   = vh * 0.25;   // fully gone by 25vh
        const NAV_SOLID  = vh * 0.60;   // nav bar goes opaque/solid at 60vh

        window.addEventListener('scroll', () => {
            const y = window.scrollY;

            // — Hero title —
            if (y <= FADE_START) {
                heroTitle.style.opacity   = '1';
                heroTitle.style.transform = 'translateY(0)';
            } else if (y < FADE_END) {
                const p = (y - FADE_START) / (FADE_END - FADE_START);
                heroTitle.style.opacity   = String(1 - p);
                heroTitle.style.transform = `translateY(${-p * 14}px)`;
            } else {
                heroTitle.style.opacity   = '0';
                heroTitle.style.transform = 'translateY(-14px)';
            }

            // — Nav name + links (fade while in hero zone) —
            if (y <= NAV_SOLID) {
                if (y <= FADE_START) {
                    navName.style.opacity  = '1';
                    navLinks.style.opacity = '1';
                } else if (y < FADE_END) {
                    const p = (y - FADE_START) / (FADE_END - FADE_START);
                    navName.style.opacity  = String(1 - p);
                    navLinks.style.opacity = String(1 - p);
                } else {
                    navName.style.opacity  = '0';
                    navLinks.style.opacity = '0';
                }
            }

            // — Nav bar itself: stays transparent until deep scroll —
            if (y > NAV_SOLID) {
                nav.style.mixBlendMode  = 'normal';
                nav.style.background    = 'rgba(255,255,255,0.96)';
                nav.style.borderBottom  = '1px solid #ebebeb';
                navName.style.opacity   = '1';
                navLinks.style.opacity  = '1';
                nav.querySelectorAll('a').forEach(a => a.style.color = '#000');
            } else {
                nav.style.mixBlendMode  = 'difference';
                nav.style.background    = 'transparent';
                nav.style.borderBottom  = 'none';
                nav.querySelectorAll('a').forEach(a => a.style.color = 'white');
            }
        }, { passive: true });

        // ── Scroll: work sections fade in on enter ─────────
        const workSections = document.querySelectorAll('.work-section');

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    observer.unobserve(entry.target);
                }
            });
        }, {
            threshold: 0.05,
            rootMargin: '0px 0px -120px 0px'
        });

        workSections.forEach(section => observer.observe(section));
    </script>
</body>
</html>
