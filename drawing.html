<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="images_2/favicon.png">
    <link rel="apple-touch-icon" href="images_2/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drawing - Brad Sherman</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #ffffff;
            color: #000000;
            overflow-x: hidden;
        }

        /* ── MODAL ────────────────────────────────────────── */
        .image-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(255,255,255,0.97);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            max-width: 90%;
            max-height: 90%;
            position: relative;
        }
        .modal-image {
            max-width: 100%;
            max-height: 90vh;
            object-fit: contain;
        }
        .close-modal {
            position: fixed;
            top: 20px; right: 30px;
            color: #000000;
            font-size: 36px;
            font-weight: 300;
            cursor: pointer;
            z-index: 1001;
            background: none;
            border: none;
            line-height: 1;
        }
        .nav-btn {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            width: 60px; height: 60px;
            cursor: pointer;
            opacity: 0.4;
            transition: opacity 0.3s;
        }
        .nav-btn:hover { opacity: 1; }
        .nav-btn::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 16px; height: 16px;
            border: 2px solid #000000;
            border-width: 2px 2px 0 0;
            transform: translate(-50%, -50%) rotate(45deg);
        }
        .prev-btn { left: 20px; }
        .prev-btn::before { transform: translate(-50%, -50%) rotate(-135deg); }
        .next-btn { right: 20px; }

        /* ── NAV ──────────────────────────────────────────── */
        nav {
            position: fixed;
            top: 0; width: 100%;
            padding: 2rem;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            mix-blend-mode: difference;
        }
        .nav-links { display: flex; gap: 2rem; align-items: center; }
        nav a { color: white; text-decoration: none; font-weight: 600; position: relative; }

        .dropdown { position: relative; display: inline-block; }
        .dropdown-content {
            position: absolute;
            top: 35px; left: 0;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 1rem 0;
            min-width: 200px;
            opacity: 0; visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            mix-blend-mode: difference;
        }
        .dropdown:hover .dropdown-content { opacity: 1; visibility: visible; transform: translateY(0); }
        .dropdown-content a {
            display: block;
            padding: 0.5rem 1.5rem;
            color: black;
            text-decoration: none;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
            font-weight: 700;
            font-size: 0.9rem;
        }
        .dropdown-content a:hover {
            background: rgba(0,0,0,0.05);
            border-left: 3px solid #ff0055;
            padding-left: 2rem;
        }

        /* ── HERO ─────────────────────────────────────────── */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            position: relative;
            background: #ffffff;
            overflow: hidden;
        }

        .hero-title {
            font-family: 'Inter', sans-serif;
            font-size: clamp(3rem, 8vw, 7rem);
            font-weight: 300;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #000000;
            text-align: center;
            line-height: 1;
            margin-bottom: 1.5rem;
            opacity: 0;
            animation: fadeIn 1s ease 0.3s forwards;
        }

        .hero-sub {
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: #939598;
            text-align: center;
            opacity: 0;
            animation: fadeIn 1s ease 0.55s forwards;
        }

        /* First image peeking at bottom */
        .hero-peek {
            position: absolute;
            bottom: 0; left: 50%;
            transform: translateX(-50%);
            width: min(600px, 80vw);
            height: 220px;
            overflow: hidden;
            opacity: 0;
            animation: fadeIn 1s ease 0.8s forwards;
        }
        .hero-peek img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            display: block;
        }

        /* scroll hint */
        .scroll-hint {
            position: absolute;
            bottom: 200px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            opacity: 0;
            animation: fadeIn 1s ease 1.1s forwards;
        }
        .scroll-hint span {
            font-size: 0.6rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #c0c0c0;
            font-weight: 400;
        }
        .scroll-line {
            width: 1px;
            height: 40px;
            background: linear-gradient(to bottom, #c0c0c0, transparent);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        /* override for peek which has its own transform */
        .hero-peek { animation-name: fadeInPeek; }
        @keyframes fadeInPeek {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        /* ── WORK GRID ────────────────────────────────────── */
        .work-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 6rem 5% 10rem 5%;
        }

        /* Each work block: image + consistent spacing + info */
        .work-section {
            margin-bottom: 8rem;
        }

        .single-image { width: 100%; }

        /* ALL images use <img> tags now for consistent natural height */
        .work-img {
            width: 100%;
            display: block;
            height: auto;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }
        .work-img:hover { opacity: 0.92; }

        /* Consistent spacing: always 2rem between image bottom and title */
        .work-info {
            margin-top: 1.8rem;
            padding-top: 1.4rem;
            border-top: 1px solid #ebebeb;
        }

        .work-item-title {
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #000000;
            letter-spacing: 0.02em;
        }

        .project-year {
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            color: #939598;
            font-weight: 400;
            margin-bottom: 0.2rem;
        }

        .project-institution {
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            color: #939598;
            font-style: italic;
            font-weight: 400;
            margin-bottom: 0;
        }

        .project-description {
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            color: #939598;
            line-height: 1.6;
            margin-top: 0.6rem;
            max-width: 500px;
        }

        /* ── MOBILE ───────────────────────────────────────── */
        @media (max-width: 768px) {
            nav { padding: 1rem; }
            .nav-links { gap: 1rem; }
            .hero-title { font-size: clamp(2.2rem, 10vw, 4rem); }
            .work-container { padding: 4rem 5% 8rem 5%; }
            .work-section { margin-bottom: 5rem; }
            .hero-peek { width: 90vw; height: 160px; }
            .scroll-hint { bottom: 145px; }

            .dropdown-content {
                position: fixed !important;
                top: 80px !important;
                right: 1rem !important;
                left: auto !important;
                width: 50% !important;
                min-width: unset !important;
                background: #000000 !important;
                border: none !important;
                mix-blend-mode: normal !important;
                backdrop-filter: none !important;
            }
            .dropdown-content a {
                color: #ffffff !important;
                text-align: right !important;
                border-left: none !important;
                mix-blend-mode: normal !important;
            }
        }
    </style>
</head>
<body>

    <!-- Modal -->
    <div id="imageModal" class="image-modal">
        <button class="close-modal">&times;</button>
        <button class="nav-btn prev-btn"></button>
        <button class="nav-btn next-btn"></button>
        <div class="modal-content">
            <img class="modal-image" src="" alt="">
        </div>
    </div>

    <!-- Nav -->
    <nav>
        <div style="font-family:'Inter',sans-serif;font-weight:700;font-size:0.9rem;letter-spacing:0.08em;">
            <a href="index.html" style="color:white;text-decoration:none;text-transform:uppercase;">Brad Sherman</a>
        </div>
        <div class="nav-links">
            <div class="dropdown">
                <a href="#" style="color:white;text-decoration:none;font-weight:600;cursor:pointer;">Work</a>
                <div class="dropdown-content">
                    <a href="index.html">Home</a>
                    <a href="painting.html">Painting</a>
                    <a href="drawing.html">Drawing</a>
                    <a href="woodworking.html">Woodworking</a>
                    <a href="websites.html">Websites</a>
                    <a href="photography.html">Photography</a>
                </div>
            </div>
            <a href="Contacts.html" style="color:white;text-decoration:none;font-weight:600;">Contact</a>
        </div>
    </nav>

    <!-- Hero: centered title + first image peeking -->
    <section class="hero">
        <h1 class="hero-title">Drawings</h1>
        <p class="hero-sub">Pencil &nbsp;·&nbsp; Ink &nbsp;·&nbsp; Charcoal</p>
        <div class="scroll-hint">
            <span>Scroll</span>
            <div class="scroll-line"></div>
        </div>
        <div class="hero-peek">
            <img src="images_2/2ww.jpg" alt="Still Life preview"/>
        </div>
    </section>

    <!-- Work -->
    <section class="work-container">

        <div class="work-section">
            <div class="single-image">
                <img class="work-img" src="images_2/2ww.jpg" alt="Still Life"/>
            </div>
            <div class="work-info">
                <h3 class="work-item-title">Still Life</h3>
                <p class="project-year">2022</p>
            </div>
        </div>

        <div class="work-section">
            <div class="single-image">
                <img class="work-img" src="images_2/house.jpg" alt="Martha's Vineyard"/>
            </div>
            <div class="work-info">
                <h3 class="work-item-title">Martha's Vineyard</h3>
                <p class="project-year">2023</p>
                <p class="project-institution">UW-Madison</p>
            </div>
        </div>

        <div class="work-section">
            <div class="single-image">
                <img class="work-img" src="images_2/rope.jpg" alt="Still Life — Rope"/>
            </div>
            <div class="work-info">
                <h3 class="work-item-title">Still Life</h3>
                <p class="project-year">2023</p>
                <p class="project-institution">UW-Madison</p>
            </div>
        </div>

        <div class="work-section">
            <div class="single-image">
                <img class="work-img" src="images_2/dad.jpg" alt="Grandad Portrait"/>
            </div>
            <div class="work-info">
                <h3 class="work-item-title">Grandad Portrait</h3>
                <p class="project-year">2022</p>
            </div>
        </div>

        <div class="work-section">
            <div class="single-image">
                <img class="work-img" src="images_2/mountains.jpg" alt="Mountains"/>
            </div>
            <div class="work-info">
                <h3 class="work-item-title">Mountains</h3>
                <p class="project-year">2023</p>
                <p class="project-institution">UW-Madison</p>
            </div>
        </div>

        <div class="work-section">
            <div class="single-image">
                <img class="work-img" src="images_2/egg.jpg" alt="Still Life — Egg"/>
            </div>
            <div class="work-info">
                <h3 class="work-item-title">Still Life</h3>
                <p class="project-year">2022</p>
            </div>
        </div>

    </section>

    <script>
        // Modal
        const modal      = document.getElementById('imageModal');
        const modalImage = document.querySelector('.modal-image');
        const closeBtn   = document.querySelector('.close-modal');
        const prevBtn    = document.querySelector('.prev-btn');
        const nextBtn    = document.querySelector('.next-btn');
        const allImgs    = [...document.querySelectorAll('.work-img')];
        let currentIdx   = 0;

        function openModal(idx) {
            currentIdx = idx;
            modalImage.src = allImgs[idx].src;
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }
        function closeModal() {
            modal.style.display = 'none';
            document.body.style.overflow = '';
        }
        function showNext() {
            currentIdx = (currentIdx + 1) % allImgs.length;
            modalImage.src = allImgs[currentIdx].src;
        }
        function showPrev() {
            currentIdx = (currentIdx - 1 + allImgs.length) % allImgs.length;
            modalImage.src = allImgs[currentIdx].src;
        }

        allImgs.forEach((img, i) => img.addEventListener('click', () => openModal(i)));
        closeBtn.addEventListener('click', closeModal);
        nextBtn.addEventListener('click', showNext);
        prevBtn.addEventListener('click', showPrev);
        modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
        document.addEventListener('keydown', e => {
            if (modal.style.display !== 'flex') return;
            if (e.key === 'Escape')      closeModal();
            if (e.key === 'ArrowRight')  showNext();
            if (e.key === 'ArrowLeft')   showPrev();
        });

        // Nav scroll blend
        const nav = document.querySelector('nav');
        window.addEventListener('scroll', () => {
            nav.style.mixBlendMode = window.scrollY > 80 ? 'normal' : 'difference';
            nav.style.background   = window.scrollY > 80 ? 'rgba(255,255,255,0.96)' : 'transparent';
            nav.style.borderBottom = window.scrollY > 80 ? '1px solid #ebebeb' : 'none';
            // flip link colors once nav goes light
            nav.querySelectorAll('a').forEach(a => {
                a.style.color = window.scrollY > 80 ? '#000' : 'white';
            });
        }, { passive: true });
    </script>
</body>
</html>
