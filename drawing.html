<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="images_2/favicon.png">
    <link rel="apple-touch-icon" href="images_2/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Drawing - Brad Sherman</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #ffffff;
            color: #000000;
            overflow-x: hidden;
        }

        /* ── GRAIN OVERLAY ────────────────────────────────── */
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            background-size: 200px 200px;
        }

        /* ── MODAL ────────────────────────────────────────── */
        .image-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(255,255,255,0.98);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content { max-width: 90%; max-height: 90%; position: relative; }
        .modal-image { max-width: 100%; max-height: 90vh; object-fit: contain; }
        .close-modal {
            position: fixed; top: 20px; right: 30px;
            color: #000; font-size: 36px; font-weight: 300;
            cursor: pointer; z-index: 1001;
            background: none; border: none; line-height: 1;
        }
        .nav-btn {
            position: fixed; top: 50%; transform: translateY(-50%);
            background: none; border: none;
            width: 60px; height: 60px; cursor: pointer;
            opacity: 0.25; transition: opacity 0.3s;
        }
        .nav-btn:hover { opacity: 1; }
        .nav-btn::before {
            content: ''; position: absolute;
            top: 50%; left: 50%;
            width: 14px; height: 14px;
            border: 1.5px solid #000;
            border-width: 1.5px 1.5px 0 0;
            transform: translate(-50%, -50%) rotate(45deg);
        }
        .prev-btn { left: 20px; }
        .prev-btn::before { transform: translate(-50%, -50%) rotate(-135deg); }
        .next-btn { right: 20px; }

        /* ── SAFE AREA TOP COVER ──────────────────────────── */
        /* Always white behind the status bar / dynamic island */
        .top-cover {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: env(safe-area-inset-top, 50px);
            background: #ffffff;
            z-index: 600;
            pointer-events: none;
        }
        .header-panel {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 25vh;
            background: #000000;
            z-index: 490;
            transition: opacity 0.5s ease;
            padding-top: env(safe-area-inset-top);
        }

        /* ── NAV ──────────────────────────────────────────── */
        nav {
            position: fixed;
            top: 0; left: 0; width: 100%;
            padding: 2rem 2rem 2rem 2rem;
            padding-top: max(2rem, env(safe-area-inset-top));
            z-index: 500;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            transition: background 0.4s ease, border-bottom 0.4s ease;
        }

        /* solid white cover that sits behind nav text but above everything else */
        nav.nav-solid-cover::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.97);
            z-index: -1;
        }

        .nav-left {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: calc(25vh - 4rem);
        }

        .nav-name {
            font-family: 'Futura', 'Futura PT', 'Century Gothic', 'Trebuchet MS', sans-serif;
            font-weight: 900;
            font-size: 1.05rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #ffffff;
            opacity: 0;
            transform: translateX(-28px);
            animation: slideInLeft 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.5s forwards;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .hero-title {
            font-family: 'Futura', 'Futura PT', 'Century Gothic', 'Trebuchet MS', sans-serif;
            font-weight: 900;
            font-size: clamp(4rem, 11vw, 7.5rem);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            line-height: 1;
            opacity: 0;
            animation: fadeTitle 1.2s ease 0.2s forwards;
            will-change: opacity, transform;
            background: linear-gradient(
                90deg,
                #ffffff 0%,
                #ffffff 5%,
                #c2410c 18%,
                #92400e 30%,
                #1e40af 42%,
                #0f766e 54%,
                #c2410c 66%,
                #92400e 74%,
                #ffffff 82%,
                #ffffff 100%
            );
            background-size: 600% 100%;
            background-position: 100% 0;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: baseline;
            opacity: 0;
            animation: fadeUp 0.9s ease 0.65s forwards;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .nav-links a, .dropdown > a {
            line-height: 1;
            display: inline-block;
        }

        nav a { color: #ffffff; text-decoration: none; font-weight: 600; }

        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-28px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeTitle {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        /* ── DROPDOWN ─────────────────────────────────────── */
        .dropdown { position: relative; display: inline-block; }
        .dropdown-content {
            position: absolute;
            top: 35px; left: 0;
            background: #ffffff;
            border: 1px solid #e8e8e8;
            border-radius: 8px;
            padding: 1rem 0;
            min-width: 200px;
            opacity: 0; visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            mix-blend-mode: normal;
            box-shadow: 0 8px 32px rgba(0,0,0,0.08);
        }
        .dropdown:hover .dropdown-content { opacity: 1; visibility: visible; transform: translateY(0); }
        .dropdown-content a {
            display: block;
            padding: 0.5rem 1.5rem;
            color: #000000 !important;
            text-decoration: none;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 0.02em;
        }
        .dropdown-content a:hover {
            background: rgba(0,0,0,0.04);
            border-left: 3px solid #000;
            padding-left: 2rem;
        }

        /* ── HERO SPACER ──────────────────────────────────── */
        .hero-spacer { height: 55vh; }

        /* ── WORK GRID ────────────────────────────────────── */
        .work-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 5% 12rem 5%;
        }

        .work-section {
            margin-bottom: 18rem;
            opacity: 0;
            transform: translateY(28px);
            transition: opacity 1.4s ease, transform 1.4s ease;
            position: relative;
        }
        .work-section.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .img-wrap { width: 100%; }

        .work-img {
            width: 100%;
            display: block;
            height: auto;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }
        .work-img:hover { opacity: 0.9; }

        .work-info {
            margin-top: 1.8rem;
            padding-top: 1.4rem;
            border-top: 0.5px solid #e0e0e0;
        }

        .work-item-title {
            font-family: 'Futura', 'Futura PT', 'Century Gothic', 'Trebuchet MS', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 0.45rem;
            color: #000000;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .project-year {
            font-family: 'Futura', 'Futura PT', 'Century Gothic', 'Trebuchet MS', sans-serif;
            font-size: 0.75rem;
            color: #999999;
            font-weight: 400;
            letter-spacing: 0.08em;
            margin-bottom: 0.15rem;
        }

        .project-institution {
            font-family: 'Futura', 'Futura PT', 'Century Gothic', 'Trebuchet MS', sans-serif;
            font-size: 0.75rem;
            color: #999999;
            font-weight: 400;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        /* ── MOBILE ───────────────────────────────────────── */
           @media (max-width: 768px) {
            .header-panel { height: 18vh; }
            nav { padding: 1rem; }
            .nav-left { height: calc(18vh - 2.8rem); }
            .nav-name { font-size: 1.05rem; }
            .nav-links {
                gap: 0.4rem;
                align-items: baseline;
                align-self: flex-start;
                margin-top: 0;
                padding-right: 0;
            }
            .nav-links a { font-size: 0.68rem; letter-spacing: 0.02em; }
            .hero-title { font-size: clamp(2.5rem, 10vw, 3.6rem); }
            .work-container { padding: 0 5% 8rem 5%; }
            .work-section { margin-bottom: 16rem; }
            .hero-spacer { height: 42vh; }

            /* FIX: dropdown full-width, no transforms that could shift it */
            .dropdown-content {
                position: fixed !important;
                top: 80px !important;
                right: -4rem !important;
                left: auto !important;
                width: 44vw !important;
                min-width: unset !important;
                max-width: 100vw !important;
                transform: none !important;
                background: #000000 !important;
                border: none !important;
                border-radius: 12px !important;
                mix-blend-mode: normal !important;
                backdrop-filter: none !important;
                overflow: hidden !important;
            }
            .dropdown:hover .dropdown-content {
                transform: none !important;
            }
            .dropdown-content a {
                color: #ffffff !important;
                text-align: left !important;
                border-left: none !important;
                padding: 0.6rem 0 0.6rem 1.5rem !important;
                letter-spacing: 0.04em !important;
                white-space: nowrap !important;
            }
            .dropdown-content a:hover {
                border-left: none !important;
                padding-left: 1.5rem !important;
                background: rgba(255,255,255,0.08) !important;
            }
        }
    </style>
</head>
<body>

    <!-- Modal -->
    <div id="imageModal" class="image-modal">
        <button class="close-modal">&times;</button>
        <button class="nav-btn prev-btn"></button>
        <button class="nav-btn next-btn"></button>
        <div class="modal-content">
            <img class="modal-image" src="" alt="">
        </div>
    </div>

    <!-- Safe area top cover - always white above dynamic island -->
    <div class="top-cover" id="topCover"></div>

    <!-- Black header panel -->
    <div class="header-panel" id="headerPanel"></div>

    <!-- Nav -->
    <nav id="mainNav">
        <div class="nav-left">
            <div class="nav-name" id="navName">
                <a href="index.html" style="color:#ffffff;text-decoration:none;">Brad Sherman</a>
            </div>
            <div id="heroTitleWrap" style="will-change:opacity;">
                <h1 class="hero-title" id="heroTitle">Drawings</h1>
            </div>
        </div>
        <div class="nav-links" id="navLinks">
            <div class="dropdown">
                <a href="#" style="color:#ffffff;text-decoration:none;font-weight:600;cursor:pointer;">Work</a>
                <div class="dropdown-content">
                    <a href="index.html">Home</a>
                    <a href="painting.html">Painting</a>
                    <a href="drawing.html">Drawing</a>
                    <a href="woodworking.html">Woodworking</a>
                    <a href="websites.html">Websites</a>
                    <a href="photography.html">Photography</a>
                </div>
            </div>
            <a href="Contacts.html" style="color:#ffffff;text-decoration:none;font-weight:600;">Contact</a>
        </div>
    </nav>

    <div class="hero-spacer"></div>

    <!-- Work -->
    <section class="work-container">

        <div class="work-section">
            <div class="single-image">
                <picture>
                    <source media="(max-width: 768px)" srcset="images_2/1-mobile.jpg">
                    <source media="(min-width: 769px)" srcset="images_2/1-desktop.jpg">
                    <img class="work-img" src="images_2/1-desktop.jpg" alt="Still Life" loading="eager" decoding="async"/>
                </picture>
            </div>
            <div class="work-info">
                <h3 class="work-item-title">Still Life</h3>
                <p class="project-year">2022</p>
            </div>
        </div>

        <div class="work-section">
            <div class="single-image">
                <picture>
                    <source media="(max-width: 768px)" srcset="images_2/2-mobile.jpg">
                    <source media="(min-width: 769px)" srcset="images_2/2-desktop.jpg">
                    <img class="work-img" src="images_2/2-desktop.jpg" alt="Martha's Vineyard" loading="lazy" decoding="async"/>
                </picture>
            </div>
            <div class="work-info">
                <h3 class="work-item-title">Martha's Vineyard</h3>
                <p class="project-year">2023</p>
                <p class="project-institution">UW–Madison</p>
            </div>
        </div>

        <div class="work-section">
            <div class="single-image">
                <picture>
                    <source media="(max-width: 768px)" srcset="images_2/3-mobile.jpg">
                    <source media="(min-width: 769px)" srcset="images_2/3-desktop.jpg">
                    <img class="work-img" src="images_2/3-desktop.jpg" alt="Still Life — Rope" loading="lazy" decoding="async"/>
                </picture>
            </div>
            <div class="work-info">
                <h3 class="work-item-title">Still Life</h3>
                <p class="project-year">2023</p>
                <p class="project-institution">UW–Madison</p>
            </div>
        </div>

        <div class="work-section">
            <div class="single-image">
                <picture>
                    <source media="(max-width: 768px)" srcset="images_2/4-mobile.jpg">
                    <source media="(min-width: 769px)" srcset="images_2/4-desktop.jpg">
                    <img class="work-img" src="images_2/4-desktop.jpg" alt="Grandad Portrait" loading="lazy" decoding="async"/>
                </picture>
            </div>
            <div class="work-info">
                <h3 class="work-item-title">Grandad Portrait</h3>
                <p class="project-year">2022</p>
            </div>
        </div>

        <div class="work-section">
            <div class="single-image">
                <picture>
                    <source media="(max-width: 768px)" srcset="images_2/5-mobile.jpg">
                    <source media="(min-width: 769px)" srcset="images_2/5-desktop.jpg">
                    <img class="work-img" src="images_2/5-desktop.jpg" alt="Mountains" loading="lazy" decoding="async"/>
                </picture>
            </div>
            <div class="work-info">
                <h3 class="work-item-title">Mountains</h3>
                <p class="project-year">2023</p>
                <p class="project-institution">UW–Madison</p>
            </div>
        </div>

        <div class="work-section">
            <div class="single-image">
                <picture>
                    <source media="(max-width: 768px)" srcset="images_2/6-mobile.jpg">
                    <source media="(min-width: 769px)" srcset="images_2/6-desktop.jpg">
                    <img class="work-img" src="images_2/6-desktop.jpg" alt="Still Life — Egg" loading="lazy" decoding="async"/>
                </picture>
            </div>
            <div class="work-info">
                <h3 class="work-item-title">Still Life</h3>
                <p class="project-year">2022</p>
            </div>
        </div>

    </section>

    <script>
        // ── Modal ──────────────────────────────────────────
        const modal      = document.getElementById('imageModal');
        const modalImage = document.querySelector('.modal-image');
        const closeBtn   = document.querySelector('.close-modal');
        const prevBtn    = document.querySelector('.prev-btn');
        const nextBtn    = document.querySelector('.next-btn');
        const allImgs    = [...document.querySelectorAll('.work-img')];
        let currentIdx   = 0;

        function openModal(idx) {
            currentIdx = idx;
            modalImage.src = allImgs[idx].src;
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }
        function closeModal() {
            modal.style.display = 'none';
            document.body.style.overflow = '';
        }
        function showNext() {
            currentIdx = (currentIdx + 1) % allImgs.length;
            modalImage.src = allImgs[currentIdx].src;
        }
        function showPrev() {
            currentIdx = (currentIdx - 1 + allImgs.length) % allImgs.length;
            modalImage.src = allImgs[currentIdx].src;
        }

        allImgs.forEach((img, i) => img.addEventListener('click', () => openModal(i)));
        closeBtn.addEventListener('click', closeModal);
        nextBtn.addEventListener('click', showNext);
        prevBtn.addEventListener('click', showPrev);
        modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
        document.addEventListener('keydown', e => {
            if (modal.style.display !== 'flex') return;
            if (e.key === 'Escape')      closeModal();
            if (e.key === 'ArrowRight')  showNext();
            if (e.key === 'ArrowLeft')   showPrev();
        });

        // ── Scroll ────────────────────────────────────────
        const nav           = document.getElementById('mainNav');
        const headerPanel   = document.getElementById('headerPanel');
        const topCover      = document.getElementById('topCover');
        const heroTitle     = document.getElementById('heroTitle');
        const heroTitleWrap = document.getElementById('heroTitleWrap');
        const navName       = document.getElementById('navName');
        const navLinks      = document.getElementById('navLinks');
        const navLeft       = document.querySelector('.nav-left');

        const vh          = window.innerHeight;
        const isMobile    = window.innerWidth <= 768;
        const panelH      = isMobile ? 0.18 : 0.25;
        const FADE_START  = 0;
        const FADE_END    = vh * panelH;
        const TITLE_START = vh * (isMobile ? 0.12 : 0.18);
        const TITLE_END   = vh * (isMobile ? 0.32 : 0.42);
        const NAV_SOLID   = vh * (isMobile ? 0.38 : 0.50);
        const COLOR_END   = vh * (isMobile ? 0.12 : 0.18);

        window.addEventListener('scroll', () => {
            const y = window.scrollY;

            // — Black panel fade —
            if (y <= 0) {
                headerPanel.style.opacity = '1';
            } else if (y < FADE_END) {
                headerPanel.style.opacity = String(1 - y / FADE_END);
            } else {
                headerPanel.style.opacity = '0';
            }

            // — Color sweep —
            heroTitle.style.transition = 'none';
            if (y <= 0) {
                heroTitle.style.backgroundPosition = '100% 0';
            } else if (y < COLOR_END) {
                const pos = 100 - ((y / COLOR_END) * 70);
                heroTitle.style.backgroundPosition = `${pos}% 0`;
            } else {
                heroTitle.style.backgroundPosition = '30% 0';
            }

            // — Title fade —
            if (y <= TITLE_START) {
                heroTitleWrap.style.opacity   = '1';
                heroTitleWrap.style.transform = 'translateY(0)';
            } else if (y < TITLE_END) {
                const p = (y - TITLE_START) / (TITLE_END - TITLE_START);
                heroTitleWrap.style.opacity   = String(1 - p);
                heroTitleWrap.style.transform = `translateY(${-p * 12}px)`;
            } else {
                heroTitleWrap.style.opacity   = '0';
                heroTitleWrap.style.transform = 'translateY(-12px)';
            }

            // — Nav text fade —
            if (y <= NAV_SOLID) {
                if (y <= 0) {
                    navName.style.opacity  = '1';
                    navLinks.style.opacity = '1';
                } else if (y < FADE_END) {
                    const p = y / FADE_END;
                    navName.style.opacity  = String(1 - p);
                    navLinks.style.opacity = String(1 - p);
                } else {
                    navName.style.opacity  = '0';
                    navLinks.style.opacity = '0';
                }
            }

            // — Top cover color matches nav state —
            topCover.style.background = y > NAV_SOLID ? '#ffffff' : '#000000';

            // — Nav goes solid —
            if (y > NAV_SOLID) {
                nav.style.background         = 'rgba(255,255,255,0.97)';
                nav.style.borderBottom       = '0.5px solid #ebebeb';
                nav.style.alignItems         = 'center';
                nav.style.paddingTop         = isMobile ? 'max(1rem, env(safe-area-inset-top))' : '2rem';
                navLeft.style.height         = 'auto';
                navLeft.style.justifyContent = 'flex-start';
                navLeft.style.gap            = '0';
                navName.style.opacity        = '1';
                navLinks.style.opacity       = '1';
                heroTitleWrap.style.display  = 'none';
                nav.querySelectorAll('a:not(.dropdown-content a)').forEach(a => a.style.color = '#000');
            } else {
                nav.style.background         = 'transparent';
                nav.style.borderBottom       = 'none';
                nav.style.paddingBottom      = isMobile ? '1rem' : '2rem';
                nav.style.alignItems         = 'flex-start';
                navLeft.style.height         = isMobile ? 'calc(18vh - 2rem)' : 'calc(25vh - 4rem)';
                navLeft.style.justifyContent = 'space-between';
                navLeft.style.gap            = '';
                heroTitleWrap.style.display  = '';
                nav.querySelectorAll('a:not(.dropdown-content a)').forEach(a => a.style.color = '#fff');
            }
        }, { passive: true });

        // ── Work sections fade in ──────────────────────────
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.05, rootMargin: '0px 0px -120px 0px' });

        document.querySelectorAll('.work-section').forEach(s => observer.observe(s));
    </script>
</body>
</html>
